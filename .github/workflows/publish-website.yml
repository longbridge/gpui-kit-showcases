name: Publish Website
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'order.json'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/publish-website.yml'
  schedule:
    # Monday 00:00 UTC / 08:00 Singapore time.
    - cron: '0 0 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: showcases-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.6'
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run validate
  publish:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Always include the latest merged apps, including queued updates.
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.6'
      - run: bun install --frozen-lockfile
      - name: Refresh GitHub Stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun run validate
          bun run update-stars
          bun run validate
      - name: Commit updated star counts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps
          if ! git diff --cached --quiet; then
            git commit -m 'Update GitHub Stars'
            git push origin HEAD:main
          fi
          # Commits made with GITHUB_TOKEN do not start another push workflow.
      - name: Trigger GPUI Kit documentation publication
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Configure DOCS_DISPATCH_TOKEN with Actions: write on longbridge/gpui-kit, then rerun this workflow.'
            exit 1
          fi
          gh workflow run release-docs.yml --repo longbridge/gpui-kit --ref main
